<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrontDesk OS</title>
<style>
:root{--bg:#fff8f0;--ink:#3a2e2a;--muted:#7a6a62;--card:#fff;--line:#f1e4d8;--concierge:#ffd6e0;--pricer:#fff1b8;--triage:#d4f5e2;--scout:#d6e8ff;--accent:#ff8a65}
*{box-sizing:border-box}body{font-family:"Nunito","Quicksand","Segoe UI Rounded","SF Pro Rounded",ui-rounded,system-ui,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
header{padding:16px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0 12px 0 0}h1 span{color:var(--accent)}
.chat{display:flex;flex:1;gap:8px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;min-width:300px}
.chat input{flex:1;border:0;font:inherit;outline:none;background:transparent}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:6px 14px;cursor:pointer;transition:transform .1s}button:hover{transform:scale(1.05)}
.send{background:var(--accent);color:#fff}.ok{background:#7dd3a8;color:#16432c}.no{background:#ffb4a8;color:#5a1d14}.sleep{background:#e3dcf5;color:#3d2f6b}.wake{background:#ffe08a;color:#5a4300}
.bots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;padding:0 22px}
.bot{border-radius:24px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 rgba(58,46,42,.08)}
.bot h3{margin:0;font-size:17px}.bot p{margin:2px 0 6px;font-size:13px;color:var(--muted)}.mood{font-size:13px;font-weight:700}
.av{width:72px;height:72px;flex:none}.av svg{width:100%;height:100%}.awake .av svg{animation:bob 2.4s ease-in-out infinite}
.awake .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}.asleep .av{opacity:.75}.asleep .eye{transform:scaleY(.15);transform-box:fill-box;transform-origin:center}
.z{display:none;font-weight:800;color:#8b7fc7}.asleep .z{display:inline;animation:zz 2s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes zz{50%{opacity:.3}}
main{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;padding:14px 22px 22px}section{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px;overflow:auto;max-height:52vh}
h2{font-size:15px;margin:0 0 10px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 22px 0}.kpi{background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px 14px}.kpi b{display:block;font-size:24px}
.msg{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}.mini{width:34px;height:34px;flex:none}.mini svg{width:100%;height:100%}
.bubble{border-radius:4px 16px 16px 16px;padding:7px 11px;font-size:13px;max-width:100%}.bubble small{display:block;color:var(--muted);font-size:11px}
.card{border-radius:18px;padding:10px 12px;margin-bottom:10px;border:2px dashed var(--line)}.card .why{font-size:12px;color:var(--muted);margin:4px 0 8px}
.row{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;background:var(--line)}
.high{background:#ffb4a8}.medium{background:#ffe08a}.low{background:#c9f0d8}.empty{color:var(--muted);font-size:13px}
@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body>
<header><h1>FrontDesk <span>OS</span> 🏠</h1><div class="chat"><input id="msg" value="can I book the hall Friday for a coding meetup?"><button class="send" onclick="sim()">Send WhatsApp 💬</button></div></header>
<div class="bots" id="bots"></div>
<div class="kpis" id="rev" style="margin-top:14px"></div>
<main>
<section><h2>📋 Needs your OK</h2><div id="approvals"></div></section>
<section><h2>💬 What the bots are saying</h2><div id="activity"></div></section>
<section><h2>✅ Tasks</h2><div id="tasks"></div></section>
<section><h2>📅 Bookings: community vs company</h2><div id="bookings"></div></section>
<section><h2>🔭 Sponsor leads</h2><div id="leads"></div></section>
</main>
<script>
const FACES={
concierge:`<svg viewBox="0 0 80 80" data-avatar="concierge"><circle cx="40" cy="42" r="26" fill="#ff9fb6"/><path d="M14 40a26 26 0 0 1 52 0" fill="none" stroke="#6b4c9a" stroke-width="5"/><rect x="8" y="36" width="9" height="14" rx="4" fill="#6b4c9a"/><rect x="63" y="36" width="9" height="14" rx="4" fill="#6b4c9a"/><path d="M68 50q0 10-14 12" fill="none" stroke="#6b4c9a" stroke-width="3"/><circle cx="53" cy="62" r="3" fill="#6b4c9a"/><ellipse class="eye" cx="31" cy="40" rx="3.5" ry="4.5" fill="#3a2e2a"/><ellipse class="eye" cx="49" cy="40" rx="3.5" ry="4.5" fill="#3a2e2a"/><circle cx="25" cy="49" r="4" fill="#ff6f91" opacity=".5"/><circle cx="55" cy="49" r="4" fill="#ff6f91" opacity=".5"/><path d="M32 51q8 7 16 0" fill="none" stroke="#3a2e2a" stroke-width="3" stroke-linecap="round"/><g><animateTransform attributeName="transform" type="rotate" values="0 70 22;20 70 22;0 70 22" dur="1.2s" repeatCount="indefinite"/><circle cx="72" cy="16" r="6" fill="#ffd0a8"/></g></svg>`,
pricer:`<svg viewBox="0 0 80 80" data-avatar="pricer"><circle cx="40" cy="40" r="30" fill="#ffd34d" stroke="#e0a800" stroke-width="4"/><circle cx="40" cy="40" r="23" fill="none" stroke="#e0a800" stroke-width="2" stroke-dasharray="3 4"/><circle cx="30" cy="36" r="8" fill="#fff" stroke="#3a2e2a" stroke-width="3"/><circle cx="50" cy="36" r="8" fill="#fff" stroke="#3a2e2a" stroke-width="3"/><path d="M38 36h4" stroke="#3a2e2a" stroke-width="3"/><ellipse class="eye" cx="30" cy="36" rx="3" ry="3.5" fill="#3a2e2a"/><ellipse class="eye" cx="50" cy="36" rx="3" ry="3.5" fill="#3a2e2a"/><path d="M32 52q8 6 16 0" fill="none" stroke="#3a2e2a" stroke-width="3" stroke-linecap="round"/><text x="40" y="68" font-size="11" text-anchor="middle" font-weight="800" fill="#a67c00">£</text></svg>`,
triage:`<svg viewBox="0 0 80 80" data-avatar="triage"><rect x="14" y="12" width="52" height="62" rx="10" fill="#7dd3a8"/><rect x="19" y="20" width="42" height="50" rx="6" fill="#fff"/><rect x="30" y="7" width="20" height="11" rx="4" fill="#3f8f68"/><ellipse class="eye" cx="32" cy="36" rx="3.5" ry="4.5" fill="#3a2e2a"/><ellipse class="eye" cx="48" cy="36" rx="3.5" ry="4.5" fill="#3a2e2a"/><path d="M33 45q7 6 14 0" fill="none" stroke="#3a2e2a" stroke-width="3" stroke-linecap="round"/><path d="M25 56l3 3 5-6M38 57h16M25 64l3 3 5-6M38 65h12" fill="none" stroke="#3f8f68" stroke-width="2.5" stroke-linecap="round"/></svg>`,
scout:`<svg viewBox="0 0 80 80" data-avatar="scout"><circle cx="40" cy="46" r="26" fill="#ffd0a8"/><path d="M12 32q28-22 56 0z" fill="#c89b5a"/><rect x="10" y="30" width="60" height="6" rx="3" fill="#a07a40"/><circle cx="29" cy="45" r="10" fill="#4a6fa5"/><circle cx="51" cy="45" r="10" fill="#4a6fa5"/><rect x="36" y="42" width="8" height="6" fill="#4a6fa5"/><circle cx="29" cy="45" r="6" fill="#cfe3ff"/><circle cx="51" cy="45" r="6" fill="#cfe3ff"/><ellipse class="eye" cx="29" cy="45" rx="2.5" ry="3" fill="#3a2e2a"/><ellipse class="eye" cx="51" cy="45" rx="2.5" ry="3" fill="#3a2e2a"/><path d="M33 61q7 5 14 0" fill="none" stroke="#3a2e2a" stroke-width="3" stroke-linecap="round"/></svg>`};
const INFO={concierge:["Coco the Concierge","Waves at every guest and never sleeps on a message."],pricer:["Penny the Pricer","Crunches numbers, explains every pound."],triage:["Tilly the Triage","Turns chaos into tidy to-do lists."],scout:["Sid the Scout","Spots sponsors from miles away."]};
const COL=b=>`var(--${b})`;
const $=id=>document.getElementById(id),post=u=>fetch(u,{method:'POST'}).then(load),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function sim(){await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('msg').value})});load()}
const mini=b=>`<div class="mini">${FACES[b]||''}</div>`;
async function load(){const s=await (await fetch('/api/state')).json();
$('bots').innerHTML=s.bots.map(b=>{const[n,p]=INFO[b.name]||[b.name,''];return `<div class="bot ${b.paused?'asleep':'awake'}" style="background:${COL(b.name)}"><div class="av">${FACES[b.name]}</div><div><h3>${n} <span class="z">z Z z</span></h3><p>${p}</p><div class="mood">${b.paused?'😴 Napping':'😊 Awake and helping'}</div><button style="margin-top:6px" class="${b.paused?'wake':'sleep'}" onclick="post('/api/bots/${b.name}/${b.paused?'resume':'pause'}')">${b.paused?'☀️ Wake up':'🌙 Nap time'}</button></div></div>`}).join('');
$('rev').innerHTML=`<div class="kpi">💷 Confirmed<b>£${s.revenue.confirmed.toFixed(0)}</b></div><div class="kpi">🌱 Pipeline<b>£${s.revenue.pipeline.toFixed(0)}</b></div><div class="kpi">💛 Community discount given<b>£${s.revenue.community_gap.toFixed(0)}</b></div>`;
$('approvals').innerHTML=s.approvals.map(a=>`<div class="card" style="background:${COL(a.bot)}"><div class="msg">${mini(a.bot)}<div><b>${esc((INFO[a.bot]||[a.bot])[0])} asks:</b> ${esc(a.summary)}</div></div><div class="why">${esc(a.payload.quote?a.payload.quote.explanation:(a.payload.draft||''))}</div><button class="ok" onclick="post('/api/approvals/${a.id}/approve')">👍 Approve</button> <button class="no" onclick="post('/api/approvals/${a.id}/reject')">✋ Not now</button></div>`).join('')||'<div class="empty">All clear! Nothing waiting for you 🎉</div>';
$('activity').innerHTML=s.activity.map(a=>`<div class="msg">${mini(a.bot)}<div class="bubble" style="background:${COL(a.bot)}"><small>${esc((INFO[a.bot]||[a.bot])[0])} · ${new Date(a.ts*1000).toLocaleTimeString()}</small>${esc(a.summary)}</div></div>`).join('')||'<div class="empty">Quiet so far. Send a WhatsApp above!</div>';
$('tasks').innerHTML=s.tasks.map(t=>`<div class="row"><span class="pill ${t.urgency}">${t.urgency}</span> ${esc(t.title)} → <b>${esc(t.owner)}</b></div>`).join('')||'<div class="empty">No tasks yet.</div>';
$('bookings').innerHTML=s.bookings.map(b=>`<div class="row">${b.date} · ${esc(b.space)} · <span class="pill">${b.segment}</span> £${b.quoted_price.toFixed(0)} <s style="color:var(--muted)">£${b.company_price.toFixed(0)}</s> · <b>${b.status}</b></div>`).join('')||'<div class="empty">No bookings yet.</div>';
$('leads').innerHTML=s.leads.map(l=>`<div class="row"><b>${esc(l.name)}</b> <span class="pill">⭐ ${l.score.toFixed(0)}</span> <span class="pill">${l.pushed_to}</span><div style="color:var(--muted);font-size:12px">${esc(l.reason)}</div></div>`).join('')||'<div class="empty">No leads yet.</div>';}
load();setInterval(load,2000);
</script></body></html>
